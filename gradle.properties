# ============================================================
#  Gradle speed profile for AI Phone Agent (2 CPU / 4 GB RAM)
#  Цель: максимально быстрая повторная сборка APK.
# ============================================================

# --- Daemon + parallel + caching (главные ускорители) ---
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true

# --- Configuration cache: повторные сборки почти без настройки проекта ---
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

# --- Файловый watcher ускоряет инкрементальные сборки ---
org.gradle.vfs.watch=true

# --- Kotlin: компиляция в процессе Gradle (меньше накладных расходов) ---
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# --- Память: 2 воркера на 4 ГБ RAM ---
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official
